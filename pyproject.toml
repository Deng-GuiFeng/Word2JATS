[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word2jats"
version = "0.1.0"
description = "学术论文 Word(docx) → JATS 1.3 XML 自动结构化转换（确定性管线 + 可选 LLM 语义增强）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "学术期刊结构化技术创新大赛参赛队" }]
dependencies = [
    "python-docx>=1.1,<2",
    "lxml>=5.2",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "python-dotenv>=1.0"]
crossref = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
word2jats = "word2jats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word2jats = ["resources/*.XSL", "resources/*.yaml", "resources/dtd/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
