[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word2jats"
version = "0.1.0"
description = "学术论文 Word(docx) → JATS 1.3 XML 自动结构化转换（大模型判结构 + 确定性渲染，内容守恒）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "学术期刊结构化技术创新大赛参赛队" }]
dependencies = [
    "python-docx>=1.1,<2",
    "lxml>=6.0",              # 构建/序列化 XML、OMML→MathML 的 XSLT、JATS DTD 校验（DTD 校验需较新 libxml2）
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "openai>=1.30",          # 理解层调用大模型（OpenAI 兼容接口），方法必需
    "python-dotenv>=1.0",    # 读取 .env 中的模型 API Key
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
word2jats = "word2jats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word2jats = ["resources/*.XSL", "resources/*.yaml", "resources/dtd/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "scripts/eval_v2/tests"]
