[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word2jats"
version = "0.1.0"
description = "学术论文 Word(docx) 到 JATS 1.3 XML 的自动结构化转换原型"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-docx==1.2.0",
    "lxml==6.1.1",
    "Pillow==12.2.0",
    "PyYAML==6.0.3",
    "openai==2.42.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
web = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
]

[project.scripts]
word2jats = "word2jats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word2jats = ["resources/*.XSL", "resources/*.yaml", "resources/dtd/**/*"]
